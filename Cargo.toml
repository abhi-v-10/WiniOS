[package]
name = "winios-agent"
version = "0.1.3"
edition = "2024"
default-run = "winios-agent"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.18"
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "process", "io-util"] }
subtle = "2.6"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
png = "0.18.1"
crc32fast = "1.5.0"
futures-core = "0.3"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["io-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_DataExchange",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading",
    "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging",
    "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
    "Win32_System_Registry", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_HiDpi",
    "Win32_UI_Controls", "Win32_UI_Accessibility",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinHttp", "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
] }
